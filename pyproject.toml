[project]
name = "pa-delta-scf-methods"
version = "0.1.0"
description = "Potential-averaged and optimized effective potential ΔSCF methods"
requires-python = ">=3.12"
dependencies = [
    "pyscf",
    "basis_set_exchange",
    "psutil",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
